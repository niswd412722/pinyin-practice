name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios
        continue-on-error: true

      - name: Show iOS folder
        run: ls -la ios/

      - name: Build iOS project
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO archive

      - name: Export IPA
        run: |
          mkdir -p output
          cd ios/App
          xcodebuild -exportArchive -archive-path build/Archive/*.xcarchive -exportPath ../output -scheme App CODE_SIGNING_ALLOWED=NO -configuration Release

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: pinyin-practice-ipa
          path: output/*.ipa
          retention-days: 7
