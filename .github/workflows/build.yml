name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS project
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

      - name: Find and package IPA
        if: success()
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d 2>/dev/null | grep -v ".ipa" | head -1)
          echo "App found at: $APP_PATH"
          mkdir -p output
          cd "$(dirname "$APP_PATH")"
          zip -r ~/output/App.ipa App.app

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pinyin-practice-ipa
          path: ~/output/*.ipa
          retention-days: 7
