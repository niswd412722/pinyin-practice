<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拼音打字练习</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--p:#FF6B6B;--pd:#E85050;--bg:#FFF5F5;--card:#fff;--text:#2D3436;--tl:#636E72;--g:#6BCB77;--b:#4D96FF;--sh:0 4px 20px rgba(0,0,0,0.08)}
  body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 70px;-webkit-tap-highlight-color:transparent}
  .top-bar{background:linear-gradient(135deg,#FF6B6B,#EE5A24);padding:40px 20px 24px;text-align:center;color:#fff;border-radius:0 0 24px 24px}
  .top-bar h1{font-size:22px;font-weight:700;letter-spacing:2px}
  .top-bar .sub{font-size:13px;opacity:.85;margin-top:4px}
  .unit-bar{display:flex;gap:6px;padding:14px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .unit-bar::-webkit-scrollbar{display:none}
  .unit-btn{flex-shrink:0;padding:6px 16px;border-radius:20px;border:none;font-size:13px;font-weight:500;background:#fff;color:var(--tl);box-shadow:var(--sh);cursor:pointer;transition:all .2s}
  .unit-btn.active,.type-btn.active{background:var(--p);color:#fff}
  .stats-row{display:flex;justify-content:space-around;padding:8px 20px 6px;font-size:12px;color:var(--tl)}

  .section{display:none}.section.active{display:block}

  .word-card{background:var(--card);border-radius:20px;padding:32px 24px 24px;text-align:center;box-shadow:var(--sh);max-width:400px;margin:0 auto;position:relative}
  .word-card .mw{font-size:54px;font-weight:700;letter-spacing:10px;color:var(--text);line-height:1.3;user-select:none}
  .word-card .mw .ch{display:inline-block;cursor:pointer;transition:transform .15s;position:relative}
  .word-card .mw .ch:active{transform:scale(.85)}
  .word-card .mw .ch .py-ab{display:block;font-size:17px;font-weight:500;color:var(--p);letter-spacing:0;margin-bottom:-2px;opacity:0;transition:opacity .3s;height:24px;line-height:24px}
  .word-card .mw .ch .py-ab.sh{opacity:1}
  .word-card .play-btn{width:52px;height:52px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;font-size:22px;cursor:pointer;margin:12px auto 6px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(255,107,107,.4);transition:transform .2s}
  .word-card .play-btn:active{transform:scale(.9)}
  .word-card .py-row{font-size:19px;color:var(--p);font-weight:500;height:26px;line-height:26px;margin-top:4px;letter-spacing:2px}

  .act-row{display:flex;gap:10px;justify-content:center;padding:4px 16px}
  .act-btn{flex:1;max-width:150px;padding:11px 0;border:none;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .15s;display:flex;align-items:center;justify-content:center;gap:4px}
  .act-btn:active{transform:scale(.95)}
  .act-btn.pri{background:var(--p);color:#fff;box-shadow:0 3px 12px rgba(255,107,107,.3)}
  .act-btn.gr{background:var(--g);color:#fff;box-shadow:0 3px 12px rgba(107,203,119,.3)}
  .act-btn.gy{background:#fff;color:var(--tl);box-shadow:var(--sh)}

  /* Typing */
  .tp-wrap{max-width:400px;margin:0 auto;padding:0 16px}
  #tp-in{width:100%;padding:16px 20px;font-size:20px;text-align:center;border:2px solid #ddd;border-radius:14px;background:var(--card);color:var(--text);outline:none;transition:border-color .3s,background .3s;font-family:inherit}
  #tp-in:focus{border-color:var(--p)}
  #tp-in.ok{border-color:var(--g);background:#F0FFF4}
  #tp-in.no{border-color:var(--p);background:#FFF5F5}
  .tp-fb{text-align:center;height:28px;margin-top:8px;font-size:15px}
  .tp-fb.ok{color:var(--g)}.tp-fb.no{color:var(--p)}.tp-fb.hint{color:#fbbf24}
  .tp-act{display:flex;justify-content:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .tp-act button{padding:8px 20px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .15s}
  .tp-act button:active{transform:scale(.95)}
  .tp-c{background:var(--p);color:#fff}.tp-s{background:#fff;color:var(--tl);box-shadow:var(--sh)}
  .tp-h{border:1px solid #fbbf24;background:#fff;color:#fbbf24}
  .tp-p{background:var(--b);color:#fff;box-shadow:0 3px 12px rgba(77,150,255,.3)}

  /* Type mode buttons */
  .type-bar{display:flex;gap:6px;padding:4px 16px 10px;justify-content:center;flex-wrap:wrap}
  .type-btn{padding:5px 14px;border:1px solid #ddd;border-radius:16px;background:#fff;color:var(--tl);font-size:12px;cursor:pointer;transition:all .2s}
  .type-btn.active{background:var(--p);color:#fff;border-color:var(--p)}

  .word-list{padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px}
  .word-list a{display:inline-block;padding:8px 16px;background:var(--card);border-radius:12px;box-shadow:var(--sh);font-size:15px;text-decoration:none;color:var(--text);transition:transform .15s}
  .word-list a:active{transform:scale(.95)}
  .word-list a .wl-p{display:block;font-size:11px;color:var(--p);margin-top:2px}

  .qz-opts{display:flex;flex-direction:column;gap:10px;padding:0 16px;max-width:400px;margin:0 auto}
  .qz-op{padding:14px 20px;background:var(--card);border:2px solid #eee;border-radius:14px;font-size:17px;font-weight:500;cursor:pointer;text-align:center;transition:all .2s}
  .qz-op:active{transform:scale(.97)}
  .qz-op.ok{border-color:var(--g);background:#F0FFF4}
  .qz-op.no{border-color:var(--p);background:#FFF5F5}

  .err-book{padding:12px 16px}
  .err-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:12px 16px;margin-bottom:8px;box-shadow:var(--sh)}
  .err-item .e-w{font-size:18px;font-weight:600}
  .err-item .e-p{font-size:13px;color:var(--p);margin-top:2px}
  .err-item .e-d{background:none;border:1px solid #eee;border-radius:8px;padding:4px 10px;font-size:12px;color:var(--tl);cursor:pointer}
  .py-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.py-grid .py-c{display:flex;flex-direction:column;align-items:center;padding:10px 6px;background:var(--card);border-radius:12px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s;min-width:52px}
.py-grid .py-c:active{transform:scale(.85)}
.py-grid .py-c .py-l{font-size:22px;font-weight:700;color:var(--text)}
.py-grid .py-c .py-s{font-size:11px;color:var(--tl);margin-top:2px}
.py-grid .py-c.ym{min-width:56px}
.py-grid .py-c.ym .py-l{font-size:18px}

.empty{text-align:center;padding:60px 20px;color:var(--tl)}
  .empty .big{font-size:48px;margin-bottom:12px}

  .toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:72px;pointer-events:none;transition:transform .3s;z-index:999}
  .toast.sh{transform:translate(-50%,-50%) scale(1)}
  @keyframes bi{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  .bo{animation:bi .4s ease}

  .tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #eee;padding:6px 0 env(safe-area-inset-bottom);z-index:100}
  .tab-btn{flex:1;border:none;background:none;padding:6px 0;font-size:11px;color:var(--tl);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s}
  .tab-btn .ti{font-size:20px}.tab-btn.act{color:var(--p)}
  .tab-btn .bd{background:var(--p);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;position:absolute;margin-top:-4px;margin-left:14px}
  @media(min-width:500px){.word-card .mw{font-size:64px}.top-bar{padding:50px 20px 30px}}
</style>
</head>
<body>

<div class="toast" id="tt"></div>
<div class="top-bar"><h1>⌨️ 拼音打字</h1><div class="sub">看字打拼音 · 快快练起来</div></div>
<div class="unit-bar" id="ub"></div>
<div class="stats-row"><span>📖 学过 <strong id="lc">0</strong></span><span>✅ 正确 <strong id="cc">0</strong></span><span>📊 正确率 <strong id="rc">0%</strong></span></div>

<!-- ═══ 打字 ═══ -->
<div class="section active" id="s-type">
  <div class="word-card bo" id="tc">
    <div class="mw" id="tw"></div>
    <button class="play-btn" id="ts">🔊</button>
    <div class="py-row" id="tpy"></div>
  </div>
  <div class="tp-wrap">
    <input type="text" id="tp-in" placeholder="输入拼音..." autocomplete="off" autofocus>
    <div class="tp-fb" id="tp-fb"></div>
  </div>
  <div class="tp-act">
    <button class="tp-c" id="tp-c">✅ 检查</button>
    <button class="tp-h" id="tp-h">💡 提示</button>
    <button class="tp-s" id="tp-s">⏭ 跳过</button>
  </div>
  <div style="text-align:center;padding:6px 16px;font-size:12px;color:var(--tl)">第 <span id="tp-i">1</span> / <span id="tp-n">0</span> 题</div>
</div>

<!-- ═══ 点读 ═══ -->
<div class="section" id="s-read">
  <div class="word-card bo" id="rc">
    <div class="mw" id="rw"></div>
    <button class="play-btn" id="pb">🔊</button>
    <div class="py-row" id="rpy"></div>
  </div>
  <div class="act-row">
    <button class="act-btn gy" id="pr">◀ 上一个</button>
    <button class="act-btn gr" id="nx">下一个 ▶</button>
  </div>
  <div class="act-row">
    <button class="act-btn gy" id="tpy-btn">👁 显示拼音</button>
    <button class="act-btn gy" id="shf">🔀 随机</button>
  </div>
</div>

<!-- ═══ 词库 ═══ -->
<div class="section" id="s-list"><div class="word-list" id="wl"></div></div>

<!-- ═══ 测验 ═══ -->
<div class="section" id="s-quiz">
  <div class="word-card">
    <div class="mw" style="font-size:46px;letter-spacing:4px" id="qw"></div>
    <div class="py-row" style="color:var(--tl);font-size:14px">选择正确拼音</div>
  </div>
  <div class="qz-opts" id="qo"></div>
  <div class="act-row"><button class="act-btn pri" id="qn">下一题 ▶</button></div>
</div>

<!-- ═══ 错题 ═══ -->
<div class="section" id="s-err"><div class="err-book" id="eb"></div></div>

<!-- ═══ 拼音表 ═══ -->
<div class="section" id="s-py">
  <div style="padding:0 16px">
    <div style="font-size:16px;font-weight:700;color:var(--p);margin:10px 0 6px 4px">声母 (21个)</div>
    <div class="py-grid" id="sm-grid"></div>
    <div style="font-size:16px;font-weight:700;color:var(--p);margin:14px 0 6px 4px">韵母 (24个)</div>
    <div class="py-grid" id="ym-grid"></div>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn act" data-t="s-type"><span class="ti">⌨️</span><span>打字</span></button>
  <button class="tab-btn" data-t="s-read"><span class="ti">📖</span><span>点读</span></button>
  <button class="tab-btn" data-t="s-py"><span class="ti">🔤</span><span>拼音表</span></button>
  <button class="tab-btn" data-t="s-list"><span class="ti">📋</span><span>词库</span></button>
  <button class="tab-btn" data-t="s-quiz"><span class="ti">✍️</span><span>测验</span></button>
  <button class="tab-btn" data-t="s-err"><span class="ti">📕</span><span>错题<span class="bd" id="ebadge" style="display:none">0</span></span></button>
</div>

  {nm:'🎯 an-ang',tp:'fin',w:[
    {w:'三',p:'sān'},{w:'山',p:'shān'},{w:'站',p:'zhàn'},{w:'看',p:'kàn'},
    {w:'半',p:'bàn'},{w:'饭',p:'fàn'},{w:'帮',p:'bāng'},{w:'长',p:'cháng'},
    {w:'上',p:'shàng'},{w:'方',p:'fāng'},{w:'旁',p:'páng'},{w:'当',p:'dāng'},
  ]},
  // ── 声调练习 ──
  {nm:'🎵 四声',tp:'tone',w:[
    {w:'妈',p:'mā'},{w:'麻',p:'má'},{w:'马',p:'mǎ'},{w:'骂',p:'mà'},
    {w:'诗',p:'shī'},{w:'时',p:'shí'},{w:'使',p:'shǐ'},{w:'是',p:'shì'},
    {w:'夫',p:'fū'},{w:'福',p:'fú'},{w:'府',p:'fǔ'},{w:'富',p:'fù'},
    {w:'踢',p:'tī'},{w:'提',p:'tí'},{w:'体',p:'tǐ'},{w:'替',p:'tì'},
  ]},
  // ── 日常 ──
  {nm:'🍎 日常',tp:'keb',w:[
    {w:'你好吗',p:'nǐ hǎo ma'},{w:'早上好',p:'zǎo shang hǎo'},{w:'明天见',p:'míng tiān jiàn'},
    {w:'请问',p:'qǐng wèn'},{w:'没关系',p:'méi guān xì'},{w:'没问题',p:'méi wèn tí'},
    {w:'加油',p:'jiā yóu'},{w:'很棒',p:'hěn bàng'},{w:'生日快乐',p:'shēng rì kuài lè'},
    {w:'我爱你',p:'wǒ ài nǐ'},{w:'谢谢你',p:'xiè xiè nǐ'},{w:'对不起',p:'duì bu qǐ'},
  ]},
  {nm:'🦊 成语',tp:'keb',w:[
    {w:'一心一意',p:'yī xīn yī yì'},{w:'三心二意',p:'sān xīn èr yì'},
    {w:'五颜六色',p:'wǔ yán liù sè'},{w:'七上八下',p:'qī shàng bā xià'},
    {w:'守株待兔',p:'shǒu zhū dài tù'},{w:'画蛇添足',p:'huà shé tiān zú'},
    {w:'亡羊补牢',p:'wáng yáng bǔ láo'},{w:'对牛弹琴',p:'duì niú tán qín'},
  ]},
];

// ══ STATE ══
let cu=0, ci=0, sp=true;
let ti=0; // type index within shuffled words
let twords=[]; // shuffled type words
let le={}, er=[], qc=0, qt=0;
try{le=JSON.parse(localStorage.getItem('pd_le')||'{}')}catch{}
try{er=JSON.parse(localStorage.getItem('pd_er')||'[]')}catch{}

const $=id=>document.getElementById(id);

function spk(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)}

function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function bldChars(el,w,sh){
  el.innerHTML='';const ps=w.p.split(/\s+/);
  [...w.w].forEach((c,i)=>{
    const s=document.createElement('span');s.className='ch';
    const p=document.createElement('span');p.className='py-ab'+(sh?' sh':'');
    p.textContent=ps[i]||'';s.appendChild(p);
    const ch=document.createElement('span');ch.textContent=c;ch.style.cursor='pointer';
    ch.onclick=e=>{e.stopPropagation();spk(c)};s.appendChild(ch);el.appendChild(s);
  })
}

function mkLearned(w){le[w.w]=(le[w.w]||0)+1;localStorage.setItem('pd_le',JSON.stringify(le));upSt()}

function upSt(){$('lc').textContent=Object.keys(le).length;$('cc').textContent=qc;$('rc').textContent=qt?Math.round(qc/qt*100)+'%':'0%'}
function upEb(){const e=$('ebadge');e.textContent=er.length;e.style.display=er.length?'inline':'none'}
function addEr(w){if(!er.find(x=>x.w===w.w))er.push({w:w.w,p:w.p});localStorage.setItem('pd_er',JSON.stringify(er));upEb()}

function tt(e){$('tt').textContent=e;$('tt').classList.add('sh');setTimeout(()=>$('tt').classList.remove('sh'),500)}

// ══ TYPING ══
function initTypeWords(){
  const ww=U[cu].w;
  twords=shuf([...ww]);
  ti=0;
}
function shType(){
  if(!twords.length)initTypeWords();
  if(ti>=twords.length){ti=0;twords=shuf([...twords])}
  const w=twords[ti];
  $('tp-i').textContent=ti+1;$('tp-n').textContent=twords.length;
  bldChars($('tw'),w,false);
  $('tpy').textContent='';
  $('tp-in').value='';$('tp-in').className='';$('tp-in').focus();
  $('tp-fb').textContent='';$('tp-fb').className='';
}
$('tp-c').onclick=()=>{
  const w=twords[ti];if(!w)return;
  const v=$('tp-in').value.trim().toLowerCase();
  if(!v)return;
  const t=w.p.toLowerCase();
  if(v===t){
    $('tp-in').className='ok';
    $('tp-fb').textContent='✅ 正确！';$('tp-fb').className='tp-fb ok';
    qc++;qt++;mkLearned(w);tt('👍');
    setTimeout(()=>{ti++;shType()},600);
  }else{
    $('tp-in').className='no';
    $('tpy').textContent='🔊 '+w.p;
    $('tp-fb').innerHTML='❌ 正确: '+w.p;$('tp-fb').className='tp-fb no';
    qt++;addEr(w);tt('😅');
  }
  upSt();
};
$('tp-s').onclick=()=>{ti++;shType()};
$('tp-h').onclick=()=>{
  const w=twords[ti];if(w){$('tpy').textContent='💡 '+w.p;$('tp-fb').textContent='照着输入';$('tp-fb').className='tp-fb hint';$('tp-in').focus()}
};
$('ts').onclick=()=>{const w=twords[ti];if(w)spk(w.w)};
$('tp-in').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('tp-c').onclick()}});

// ══ READ ══
function shRead(){
  const w=U[cu].w[ci];if(!w)return;
  bldChars($('rw'),w,sp);
  $('rpy').textContent=sp?w.p:'';
  const c=$('rc');c.classList.remove('bo');void c.offsetWidth;c.classList.add('bo');
  mkLearned(w);
}
$('pr').onclick=()=>{ci--;if(ci<0)ci=U[cu].w.length-1;shRead()};
$('nx').onclick=()=>{ci++;if(ci>=U[cu].w.length)ci=0;shRead()};
$('shf').onclick=()=>{ci=Math.floor(Math.random()*U[cu].w.length);shRead()};
$('tpy-btn').onclick=()=>{sp=!sp;$('tpy-btn').textContent=sp?'🙈 隐藏':'👁 显示';shRead()};
$('pb').onclick=()=>{const w=U[cu].w[ci];if(w)spk(w.w)};

// ══ UNITS ══
function bldUnits(){
  $('ub').innerHTML='';
  U.forEach((u,i)=>{
    const b=document.createElement('button');b.className='unit-btn'+(i===cu?' active':'');
    b.textContent=u.nm;
    b.onclick=()=>{cu=i;ci=0;initTypeWords();
      document.querySelectorAll('.unit-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');shType();shRead();bldList()};
    $('ub').appendChild(b);
  });
}

function bldList(){
  $('wl').innerHTML='';
  U[cu].w.forEach((item,i)=>{
    const a=document.createElement('a');
    a.innerHTML=`${item.w} <span class="wl-p">${item.p}</span>`;
    a.href='#';a.onclick=e=>{e.preventDefault();switchTab('s-read');ci=i;shRead()};
    $('wl').appendChild(a);
  });
}

// ══ QUIZ ══
function shQuiz(){
  const ws=U[cu].w;if(ws.length<4){$('qw').textContent='词太少';$('qo').innerHTML='';return}
  const q=ws[Math.floor(Math.random()*ws.length)];
  const o=ws.filter(x=>x.w!==q.w).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.p);
  const op=[q.p,...o].sort(()=>Math.random()-.5);
  $('qw').textContent=q.w;
  $('qo').innerHTML='';let ans=false;
  op.forEach(opt=>{
    const b=document.createElement('div');b.className='qz-op';b.textContent=opt;
    b.onclick=()=>{
      if(ans)return;ans=true;qt++;
      document.querySelectorAll('.qz-op').forEach(x=>{if(x.textContent===q.p)x.classList.add('ok')});
      if(opt===q.p){b.classList.add('ok');qc++;tt('👍')}
      else{b.classList.add('no');addEr(q);tt('😅')}
      upSt();
    };
    $('qo').appendChild(b);
  });
}
$('qn').onclick=shQuiz;

// ══ PINYIN CHART ══
const SM=['b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w'];
const YM=['a','o','e','i','u','ü','ai','ei','ui','ao','ou','iu','ie','üe','er','an','en','in','un','ün','ang','eng','ing','ong'];
const YMN=['啊','喔','鹅','衣','乌','迂','爱','诶','微','奥','欧','优','耶','约','儿','安','恩','因','温','晕','昂','灯','英','钟'];

function bldPY(){
  const sg=$('sm-grid');sg.innerHTML='';
  SM.forEach(s=>{
    const d=document.createElement('div');d.className='py-c';
    const l=document.createElement('div');l.className='py-l';l.textContent=s;
    const b=document.createElement('div');b.className='py-s';b.textContent='声母';
    d.appendChild(l);d.appendChild(b);
    d.onclick=()=>spk(s+'母');
    sg.appendChild(d);
  });
  const yg=$('ym-grid');yg.innerHTML='';
  YM.forEach((y,i)=>{
    const d=document.createElement('div');d.className='py-c ym';
    const l=document.createElement('div');l.className='py-l';l.textContent=y;
    const b=document.createElement('div');b.className='py-s';b.textContent=YMN[i];
    d.appendChild(l);d.appendChild(b);
    d.onclick=()=>spk(y+'母');
    yg.appendChild(d);
  });
}

// ══ ERRORS ══
function bldErr(){
  $('eb').innerHTML='';
  if(!er.length){$('eb').innerHTML='<div class="empty"><div class="big">🎉</div><p>没有错题</p></div>';return}
  er.forEach((e,i)=>{
    const d=document.createElement('div');d.className='err-item bo';
    d.innerHTML=`<div><div class="e-w" style="cursor:pointer">${e.w}</div><div class="e-p">${e.p}</div></div><button class="e-d">删除</button>`;
    d.querySelector('.e-d').onclick=()=>{er.splice(i,1);localStorage.setItem('pd_er',JSON.stringify(er));bldErr();upEb()};
    d.querySelector('.e-w').onclick=()=>{const idx=U[cu].w.findIndex(x=>x.w===e.w);if(idx>=0){ci=idx;switchTab('s-read');shRead()}};
    $('eb').appendChild(d);
  });
}

// ══ TABS ══
function switchTab(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('act',b.dataset.t===id));
  if(id==='s-type')shType();
  if(id==='s-read')shRead();
  if(id==='s-list')bldList();
  if(id==='s-py')bldPY();
  if(id==='s-quiz')shQuiz();
  if(id==='s-err')bldErr();
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.t)));

// ══ INIT ══
bldUnits();initTypeWords();shType();shRead();upSt();upEb();bldList();
</script>
</body>
</html>
