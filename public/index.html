<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拼音打字练习</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--p:#FF6B6B;--pd:#E85050;--bg:#FFF5F5;--card:#fff;--t:#2D3436;--tl:#636E72;--g:#6BCB77;--b:#4D96FF;--y:#FFD93D;--sh:0 4px 20px rgba(0,0,0,0.08)}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;padding:0 0 70px}

/* Top */
.top-bar{background:linear-gradient(135deg,#FF6B6B,#EE5A24);padding:36px 20px 20px;text-align:center;color:#fff;border-radius:0 0 24px 24px}
.top-bar h1{font-size:22px;font-weight:700;letter-spacing:2px}
.top-bar .sub{font-size:13px;opacity:.85;margin-top:2px}

/* Streak bar */
.streak-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 4px;font-size:13px;color:var(--tl)}
.streak-bar .s-left{display:flex;align-items:center;gap:6px}
.streak-bar .s-right{display:flex;align-items:center;gap:4px;font-weight:600}
.streak-bar .s-right .star{color:var(--y);font-size:16px}
.streak-bar .s-btn{background:var(--y);border:none;border-radius:16px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(255,217,61,.4);transition:transform .15s}
.streak-bar .s-btn:active{transform:scale(.9)}
.streak-bar .s-btn.done{background:#eee;color:#aaa;box-shadow:none;cursor:default}

/* Unit bar */
.unit-bar{display:flex;gap:6px;padding:8px 16px 6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.unit-bar::-webkit-scrollbar{display:none}
.unit-btn{flex-shrink:0;padding:5px 14px;border-radius:16px;border:none;font-size:12px;font-weight:500;background:#fff;color:var(--tl);box-shadow:var(--sh);cursor:pointer;transition:all .2s;white-space:nowrap}
.unit-btn.active{background:var(--p);color:#fff}

/* Stats */
.stats-row{display:flex;justify-content:space-around;padding:6px 20px;font-size:12px;color:var(--tl)}

.section{display:none}.section.active{display:block}

/* Card */
.wc{background:var(--card);border-radius:20px;padding:28px 24px 20px;text-align:center;box-shadow:var(--sh);max-width:400px;margin:0 auto;position:relative}
.wc .mw{font-size:52px;font-weight:700;letter-spacing:10px;color:var(--t);line-height:1.3;user-select:none}
.wc .mw .ch{display:inline-block;cursor:pointer;transition:transform .15s;position:relative}
.wc .mw .ch:active{transform:scale(.85)}
.wc .mw .ch .py-ab{display:block;font-size:16px;font-weight:500;color:var(--p);letter-spacing:0;margin-bottom:-2px;opacity:0;transition:opacity .3s;height:22px;line-height:22px}
.wc .mw .ch .py-ab.sh{opacity:1}
.wc .pb{width:50px;height:50px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;font-size:22px;cursor:pointer;margin:10px auto 4px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(255,107,107,.4);transition:transform .2s}
.wc .pb:active{transform:scale(.9)}
.wc .pr{font-size:18px;color:var(--p);font-weight:500;height:24px;line-height:24px;margin-top:2px;letter-spacing:2px}

.act-r{display:flex;gap:10px;justify-content:center;padding:4px 16px}
.act-btn{flex:1;max-width:150px;padding:10px 0;border:none;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .15s;display:flex;align-items:center;justify-content:center;gap:4px}
.act-btn:active{transform:scale(.95)}
.act-btn.pr{background:var(--p);color:#fff;box-shadow:0 3px 12px rgba(255,107,107,.3)}
.act-btn.gr{background:var(--g);color:#fff;box-shadow:0 3px 12px rgba(107,203,119,.3)}
.act-btn.gy{background:#fff;color:var(--tl);box-shadow:var(--sh)}

/* Typing */
.tpw{max-width:400px;margin:0 auto;padding:0 16px}
#tpi{width:100%;padding:14px 20px;font-size:20px;text-align:center;border:2px solid #ddd;border-radius:12px;background:var(--card);color:var(--t);outline:none;transition:border-color .3s,background .3s;font-family:inherit}
#tpi:focus{border-color:var(--p)}
#tpi.ok{border-color:var(--g);background:#F0FFF4}
#tpi.no{border-color:var(--p);background:#FFF5F5}
.tpf{text-align:center;height:26px;margin-top:6px;font-size:14px}
.tpf.ok{color:var(--g)}.tpf.no{color:var(--p)}.tpf.hint{color:#fbbf24}
.tpa{display:flex;justify-content:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.tpa button{padding:7px 18px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .15s}
.tpa button:active{transform:scale(.95)}
.tpa .tc{background:var(--p);color:#fff}.tpa .ts{background:#fff;color:var(--tl);box-shadow:var(--sh)}
.tpa .th{border:1px solid #fbbf24;background:#fff;color:#fbbf24}
.tp-prog{text-align:center;padding:4px 16px 2px;font-size:12px;color:var(--tl)}

/* Pinyin grid */
.py-g{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.py-g .py-c{display:flex;flex-direction:column;align-items:center;padding:8px 5px;background:var(--card);border-radius:10px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s;min-width:48px}
.py-g .py-c:active{transform:scale(.85)}
.py-g .py-c .py-l{font-size:20px;font-weight:700;color:var(--t)}
.py-g .py-c .py-s{font-size:10px;color:var(--tl);margin-top:1px}
.py-g .py-c.ym{min-width:52px}
.py-g .py-c.ym .py-l{font-size:17px}
.py-section-title{font-size:15px;font-weight:700;color:var(--p);margin:10px 0 4px 4px}

.word-l{padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px}
.word-l a{display:inline-block;padding:7px 14px;background:var(--card);border-radius:10px;box-shadow:var(--sh);font-size:14px;text-decoration:none;color:var(--t);transition:transform .15s}
.word-l a:active{transform:scale(.95)}
.word-l a .wl-p{display:block;font-size:10px;color:var(--p);margin-top:1px}

.qz-o{display:flex;flex-direction:column;gap:8px;padding:0 16px;max-width:400px;margin:0 auto}
.qz-op{padding:12px 20px;background:var(--card);border:2px solid #eee;border-radius:12px;font-size:17px;font-weight:500;cursor:pointer;text-align:center;transition:all .2s}
.qz-op:active{transform:scale(.97)}
.qz-op.ok{border-color:var(--g);background:#F0FFF4}
.qz-op.no{border-color:var(--p);background:#FFF5F5}

/* Report */
.rp-cards{display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap}
.rp-c{flex:1;min-width:100px;background:var(--card);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--sh)}
.rp-c .rp-v{font-size:28px;font-weight:700;color:var(--p)}
.rp-c .rp-l{font-size:11px;color:var(--tl);margin-top:4px}
.rp-c .rp-v.star{color:var(--y)}
.rp-c .rp-v.st{color:var(--g)}
.rp-cate{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px}
.rp-cate-item{background:var(--card);border-radius:10px;padding:8px 12px;box-shadow:var(--sh);flex:1;min-width:80px;text-align:center}
.rp-cate-item .rp-cn{font-size:12px;color:var(--tl)}
.rp-cate-item .rp-cv{font-size:16px;font-weight:600;color:var(--t)}
.rp-cate-item .rp-cv.g{color:var(--g)}.rp-cate-item .rp-cv.y{color:var(--y)}.rp-cate-item .rp-cv.r{color:var(--p)}

.err-b{padding:12px 16px}
.err-i{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:6px;box-shadow:var(--sh)}
.err-i .e-w{font-size:17px;font-weight:600}
.err-i .e-p{font-size:12px;color:var(--p);margin-top:1px}
.err-i .e-d{background:none;border:1px solid #eee;border-radius:8px;padding:3px 8px;font-size:12px;color:var(--tl);cursor:pointer}
.empty{text-align:center;padding:40px 20px;color:var(--tl)}
.empty .big{font-size:40px;margin-bottom:8px}

/* Tab bar */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #eee;padding:4px 0 env(safe-area-inset-bottom);z-index:100}
.tab-btn{flex:1;border:none;background:none;padding:4px 0;font-size:10px;color:var(--tl);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:color .2s}
.tab-btn .ti{font-size:18px}.tab-btn.act{color:var(--p)}
.tab-btn .bd{background:var(--p);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 5px;position:absolute;margin-top:-3px;margin-left:12px}

.toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:64px;pointer-events:none;transition:transform .3s;z-index:999}
.toast.sh{transform:translate(-50%,-50%) scale(1)}

@keyframes bi{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.bo{animation:bi .35s ease}
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.pop{animation:pop .4s ease}

@media(min-width:500px){.wc .mw{font-size:60px}.top-bar{padding:45px 20px 28px}}
</style>
</head>
<body>

<div class="toast" id="tt"></div>

<div class="top-bar"><h1>⌨️ 拼音打字</h1><div class="sub">每天练一练，拼音进步快</div></div>

<div class="streak-bar">
  <div class="s-left">🔥 连续 <strong id="stk">0</strong> 天</div>
  <div class="s-right"><span class="star">⭐</span> <strong id="star-cnt">0</strong></div>
  <button class="s-btn" id="ckin-btn">📌 签到</button>
</div>

<div class="unit-bar" id="ub"></div>
<div class="stats-row"><span>📖 学过 <strong id="lc">0</strong></span><span>✅ 今天 <strong id="tdc">0</strong></span><span>📊 正确率 <strong id="rc">0%</strong></span></div>

<!-- ══ 打字 ══ -->
<div class="section active" id="s-t">
  <div class="wc bo" id="tcard">
    <div class="mw" id="tw"></div><button class="pb" id="ts">🔊</button>
    <div class="pr" id="tpy"></div>
  </div>
  <div class="tpw">
    <input type="text" id="tpi" placeholder="输入拼音..." autocomplete="off" autofocus>
    <div class="tpf" id="tpf"></div>
  </div>
  <div class="tpa">
    <button class="tc" id="tpc">✅ 检查</button>
    <button class="th" id="tph">💡 提示</button>
    <button class="ts" id="tps">⏭ 跳过</button>
  </div>
  <div class="tp-prog">第 <span id="tpi-n">1</span> / <span id="tpi-t">0</span> 题</div>
</div>

<!-- ══ 点读 ══ -->
<div class="section" id="s-r">
  <div class="wc bo" id="rc">
    <div class="mw" id="rw"></div><button class="pb" id="pb">🔊</button>
    <div class="pr" id="rpy"></div>
  </div>
  <div class="act-r">
    <button class="act-btn gy" id="pr">◀ 上一个</button>
    <button class="act-btn gr" id="nx">下一个 ▶</button>
  </div>
  <div class="act-r">
    <button class="act-btn gy" id="tpyb">👁 显示拼音</button>
    <button class="act-btn gy" id="shf">🔀 随机</button>
  </div>
</div>

<!-- ══ 拼音表 ═══ -->
<div class="section" id="s-py">
  <div style="padding:0 16px">
    <div class="py-section-title">声母 (21个)</div>
    <div class="py-g" id="smg"></div>
    <div class="py-section-title">韵母 (24个)</div>
    <div class="py-g" id="ymg"></div>
  </div>
</div>

<!-- ══ 词库 ═══ -->
<div class="section" id="s-l"><div class="word-l" id="wl"></div></div>

<!-- ══ 测验 ═══ -->
<div class="section" id="s-q">
  <div class="wc"><div class="mw" style="font-size:44px;letter-spacing:4px" id="qw"></div><div class="pr" style="color:var(--tl);font-size:13px">选择正确拼音</div></div>
  <div class="qz-o" id="qo"></div>
  <div class="act-r"><button class="act-btn pr" id="qn">下一题 ▶</button></div>
</div>

<!-- ══ 统计 ═══ -->
<div class="section" id="s-st">
  <div class="rp-cards">
    <div class="rp-c"><div class="rp-v" id="st-td">0</div><div class="rp-l">今日练习</div></div>
    <div class="rp-c"><div class="rp-v star" id="st-star">0</div><div class="rp-l">⭐ 星星</div></div>
    <div class="rp-c"><div class="rp-v st" id="st-stk">0</div><div class="rp-l">🔥 连续天数</div></div>
  </div>
  <div class="rp-cards">
    <div class="rp-c"><div class="rp-v" id="st-total">0</div><div class="rp-l">总题数</div></div>
    <div class="rp-c"><div class="rp-v" id="st-right">0</div><div class="rp-l">总正确</div></div>
    <div class="rp-c"><div class="rp-v" id="st-rate">0%</div><div class="rp-l">总正确率</div></div>
  </div>
  <div style="font-size:14px;font-weight:700;color:var(--p);padding:12px 20px 4px">各分类掌握情况</div>
  <div class="rp-cate" id="cate-st"></div>
</div>

<!-- ══ 错题 ═══ -->
<div class="section" id="s-e"><div class="err-b" id="eb"></div></div>

<div class="tab-bar">
  <button class="tab-btn act" data-t="s-t"><span class="ti">⌨️</span><span>打字</span></button>
  <button class="tab-btn" data-t="s-r"><span class="ti">📖</span><span>点读</span></button>
  <button class="tab-btn" data-t="s-py"><span class="ti">🔤</span><span>拼音</span></button>
  <button class="tab-btn" data-t="s-l"><span class="ti">📋</span><span>词库</span></button>

</div>

  ]},{n:'🎯 an-ang',w:[
    {w:'三',p:'sān'},{w:'山',p:'shān'},{w:'站',p:'zhàn'},{w:'看',p:'kàn'},
    {w:'帮',p:'bāng'},{w:'长',p:'cháng'},{w:'上',p:'shàng'},{w:'当',p:'dāng'},
  ]},
  // ── 声调 ──
  {n:'🎵 四声',w:[
    {w:'妈',p:'mā'},{w:'麻',p:'má'},{w:'马',p:'mǎ'},{w:'骂',p:'mà'},
    {w:'诗',p:'shī'},{w:'时',p:'shí'},{w:'使',p:'shǐ'},{w:'是',p:'shì'},
    {w:'夫',p:'fū'},{w:'福',p:'fú'},{w:'府',p:'fǔ'},{w:'富',p:'fù'},
  ]},
  {n:'🍎 日常',w:[
    {w:'你好吗',p:'nǐ hǎo ma'},{w:'早上好',p:'zǎo shang hǎo'},{w:'明天见',p:'míng tiān jiàn'},
    {w:'请问',p:'qǐng wèn'},{w:'没关系',p:'méi guān xì'},{w:'加油',p:'jiā yóu'},
    {w:'生日快乐',p:'shēng rì kuài lè'},{w:'我爱你',p:'wǒ ài nǐ'},
  ]},{n:'🦊 成语',w:[
    {w:'一心一意',p:'yī xīn yī yì'},{w:'三心二意',p:'sān xīn èr yì'},
    {w:'五颜六色',p:'wǔ yán liù sè'},{w:'七上八下',p:'qī shàng bā xià'},
    {w:'亡羊补牢',p:'wáng yáng bǔ láo'},{w:'画蛇添足',p:'huà shé tiān zú'},
  ]},
];

// ══ STATE ══
let cu=0,ci=0,sp=true,ti=0,tws=[],qc=0,qt=0,tdc=0;
let le={},er=[],stk=0,star=0,lcd=0;
try{let d=JSON.parse(localStorage.getItem('pd')||'{}');
  le=d.le||{};er=d.er||[];stk=d.stk||0;star=d.star||0;lcd=d.lcd||0;qc=d.qc||0;qt=d.qt||0;tdc=d.tdc||0
}catch{}
const $=id=>document.getElementById(id);

function sv(){localStorage.setItem('pd',JSON.stringify({le,er,stk,star,lcd,qc,qt,tdc}))}
function spk(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)}
function sf(e){spk(e?'👍':'😅')}
function sh(a){for(let i=a.length-1;i>0;i--){const j=~~(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tt(e){$('tt').textContent=e;$('tt').classList.add('sh');setTimeout(()=>$('tt').classList.remove('sh'),500)}

function bldC(el,w,shw){
  el.innerHTML='';const ps=w.p.split(/\s+/);
  [...w.w].forEach((c,i)=>{
    const s=document.createElement('span');s.className='ch';
    const p=document.createElement('span');p.className='py-ab'+(shw?' sh':'');p.textContent=ps[i]||'';
    s.appendChild(p);
    const ch=document.createElement('span');ch.textContent=c;ch.style.cursor='pointer';
    ch.onclick=e=>{e.stopPropagation();spk(c)};s.appendChild(ch);el.appendChild(s);
  })
}
function mL(w){le[w.w]=(le[w.w]||0)+1;sv();upSt()}
function upSt(){$('lc').textContent=Object.keys(le).length;$('tdc').textContent=tdc;$('rc').textContent=qt?Math.round(qc/qt*100)+'%':'0%';$('stk').textContent=stk;$('star-cnt').textContent=star}
function aE(w){if(!er.find(x=>x.w===w.w))er.push({w:w.w,p:w.p});sv()}

// ══ DAILY CHECK-IN ══
function ckin(){
  const td=new Date().toDateString();
  if(lcd===td){tt('✅');return}
  const yd=new Date(Date.now()-864e5).toDateString();
  stk=lcd===yd?stk+1:1;lcd=td;
  const b=Math.min(5+stk*2,30);
  star+=b;sv();upSt();
  $('ckin-btn').textContent='✅ '+b+'⭐';$('ckin-btn').classList.add('done');
  tt('🔥');
}
(function(){const td=new Date().toDateString();
  if(lcd===td){$('ckin-btn').textContent='✅ 已签到';$('ckin-btn').classList.add('done')}
})();
$('ckin-btn').onclick=ckin;

// ══ TYPING ══
function iTW(){tws=sh([...U[cu].w]);ti=0}
function sT(){
  if(!tws.length)iTW();
  if(ti>=tws.length){ti=0;tws=sh([...tws])}
  const w=tws[ti];if(!w)return;
  $('tpi-n').textContent=ti+1;$('tpi-t').textContent=tws.length;
  bldC($('tw'),w,false);$('tpy').textContent='';$('tpi').value='';$('tpi').className='';$('tpi').focus();$('tpf').textContent='';$('tpf').className='';
}
$('tpc').onclick=()=>{
  const w=tws[ti];if(!w)return;const v=$('tpi').value.trim().toLowerCase();
  if(!v)return;const t=w.p.toLowerCase();
  if(v===t){
    $('tpi').className='ok';$('tpf').textContent='✅ 正确！';$('tpf').className='tpf ok';
    qc++;qt++;tdc++;mL(w);star+=1;sv();sf(1);tt('👍');
    upSt();$('star-cnt').textContent=star;
    setTimeout(()=>{ti++;sT()},600);
  }else{
    $('tpi').className='no';$('tpy').textContent='🔊 '+w.p;
    $('tpf').innerHTML='❌ 正确: '+w.p;$('tpf').className='tpf no';
    qt++;tdc++;aE(w);sv();sf(0);tt('😅');upSt();
  }
};
$('tps').onclick=()=>{ti++;sT()};
$('tph').onclick=()=>{const w=tws[ti];if(w){$('tpy').textContent='💡 '+w.p;$('tpf').textContent='照着输入';$('tpf').className='tpf hint';$('tpi').focus()}};
$('ts').onclick=()=>{const w=tws[ti];if(w)spk(w.w)};
$('tpi').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('tpc').onclick()}});

// ══ READ ══
function sR(){
  const w=U[cu].w[ci];if(!w)return;
  bldC($('rw'),w,sp);$('rpy').textContent=sp?w.p:'';const c=$('rc');c.classList.remove('bo');void c.offsetWidth;c.classList.add('bo');mL(w);
}
$('pr').onclick=()=>{ci--;if(ci<0)ci=U[cu].w.length-1;sR()};
$('nx').onclick=()=>{ci++;if(ci>=U[cu].w.length)ci=0;sR()};
$('shf').onclick=()=>{ci=~~(Math.random()*U[cu].w.length);sR()};
$('tpyb').onclick=()=>{sp=!sp;$('tpyb').textContent=sp?'🙈 隐藏':'👁 显示';sR()};
$('pb').onclick=()=>{const w=U[cu].w[ci];if(w)spk(w.w)};

// ══ UNITS ══
function bldU(){
  $('ub').innerHTML='';
  U.forEach((u,i)=>{
    const b=document.createElement('button');b.className='unit-btn'+(i===cu?' active':'');
    b.textContent=u.n;b.onclick=()=>{cu=i;ci=0;iTW();
      document.querySelectorAll('.unit-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');sT();sR();bldL()};
    $('ub').appendChild(b);
  });
}
function bldL(){
  $('wl').innerHTML='';
  U[cu].w.forEach((item,i)=>{
    const a=document.createElement('a');a.innerHTML=`${item.w} <span class="wl-p">${item.p}</span>`;
    a.href='#';a.onclick=e=>{e.preventDefault();switchTab('s-r');ci=i;sR()};$('wl').appendChild(a);
  });
}

// ══ PINYIN TABLE ══
function bldPY(){
  const sg=$('smg');sg.innerHTML='';
  SM.forEach(s=>{const d=document.createElement('div');d.className='py-c';
    d.innerHTML=`<div class="py-l">${s}</div><div class="py-s">声母</div>`;d.onclick=()=>spk(s);sg.appendChild(d)});
  const yg=$('ymg');yg.innerHTML='';
  YM.forEach((y,i)=>{const d=document.createElement('div');d.className='py-c ym';
    d.innerHTML=`<div class="py-l">${y}</div><div class="py-s">${YMN[i]}</div>`;d.onclick=()=>spk(y);yg.appendChild(d)});
}

// ══ QUIZ ══
function sQ(){
  const ws=U[cu].w;if(ws.length<4){$('qw').textContent='词太少';$('qo').innerHTML='';return}
  const q=ws[~~(Math.random()*ws.length)];
  const o=ws.filter(x=>x.w!==q.w).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.p);
  const op=[q.p,...o].sort(()=>Math.random()-.5);
  $('qw').textContent=q.w;$('qo').innerHTML='';let ans=false;
  op.forEach(opt=>{
    const b=document.createElement('div');b.className='qz-op';b.textContent=opt;
    b.onclick=()=>{
      if(ans)return;ans=true;
      document.querySelectorAll('.qz-op').forEach(x=>{if(x.textContent===q.p)x.classList.add('ok')});
      if(opt===q.p){b.classList.add('ok');qc++;star+=1;sf(1);tt('👍')}
      else{b.classList.add('no');aE(q);sf(0);tt('😅')}
      qt++;sv();upSt();$('star-cnt').textContent=star;
    };$('qo').appendChild(b);
  });
}
$('qn').onclick=sQ;

// ══ STATS ══
function sST(){
  $('st-td').textContent=tdc;$('st-star').textContent=star;$('st-stk').textContent=stk;
  $('st-total').textContent=qt;$('st-right').textContent=qc;$('st-rate').textContent=qt?Math.round(qc/qt*100)+'%':'0%';
  // Category stats
  const cg=$('cate-st');cg.innerHTML='';
  U.forEach(u=>{
    const d=document.createElement('div');d.className='rp-cate-item';
    const total=u.w.length;const done=u.w.filter(x=>le[x.w]).length;
    const pct=total?Math.round(done/total*100):0;
    let cls='r';if(pct>=80)cls='g';else if(pct>=50)cls='y';
    d.innerHTML=`<div class="rp-cn">${u.n.slice(2)}</div><div class="rp-cv ${cls}">${done}/${total} ${pct}%</div>`;
    cg.appendChild(d);
  });
}

// ══ ERRORS ══
function bldE(){
  $('eb').innerHTML='';
  if(!er.length){$('eb').innerHTML='<div class="empty"><div class="big">🎉</div><p>没有错题</p></div>';return}
  er.forEach((e,i)=>{
    const d=document.createElement('div');d.className='err-i bo';
    d.innerHTML=`<div><div class="e-w" style="cursor:pointer">${e.w}</div><div class="e-p">${e.p}</div></div><button class="e-d">删除</button>`;
    d.querySelector('.e-d').onclick=()=>{er.splice(i,1);sv();bldE()};
    d.querySelector('.e-w').onclick=()=>{const idx=U[cu].w.findIndex(x=>x.w===e.w);if(idx>=0){ci=idx;switchTab('s-r');sR()}};
    $('eb').appendChild(d);
  });
}

// ══ TABS ══
function switchTab(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('act',b.dataset.t===id));
  if(id==='s-t')sT();if(id==='s-r')sR();if(id==='s-py')bldPY();if(id==='s-l')bldL();if(id==='s-q')sQ();if(id==='s-st')sST();if(id==='s-e')bldE();
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.t)));

// ══ INIT ══
bldU();iTW();sT();sR();upSt();
</script>
</body>
</html>
