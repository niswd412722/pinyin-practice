<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拼音打字练习</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    overflow-x: hidden;
    padding: 20px 16px 80px;
  }

  /* ── Header ── */
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 22px; color: #e94560; }
  .header .subtitle { font-size: 13px; color: #888; margin-top: 2px; }

  /* ── Mode Select ── */
  .mode-bar {
    display: flex; gap: 6px; margin-bottom: 12px;
    justify-content: center; flex-wrap: wrap;
  }
  .mode-btn {
    padding: 6px 14px; border: 1px solid #444; border-radius: 20px;
    background: transparent; color: #888; font-size: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .mode-btn.active { border-color: #e94560; color: #e94560; background: rgba(233,69,96,0.1); }

  /* ── Difficulty Select ── */
  .level-bar {
    display: flex; gap: 8px; margin-bottom: 16px;
    justify-content: center; flex-wrap: wrap;
  }
  .lvl-btn {
    padding: 5px 14px; border: 1px solid #333; border-radius: 16px;
    background: transparent; color: #666; font-size: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .lvl-btn.active { border-color: #e94560; color: #e94560; background: rgba(233,69,96,0.1); }

  /* ── Stats ── */
  .stats {
    display: flex; gap: 24px; justify-content: center;
    margin-bottom: 16px;
  }
  .stat { text-align: center; }
  .stat-val { font-size: 22px; font-weight: bold; color: #e94560; }
  .stat-lbl { font-size: 11px; color: #666; }

  /* ── Card ── */
  .card {
    background: #16213e; border-radius: 16px; padding: 28px 24px;
    text-align: center; margin-bottom: 20px;
    border: 2px solid #e94560; max-width: 480px; margin-left: auto; margin-right: auto;
    position: relative;
  }
  .card .char-display {
    font-size: 52px; font-weight: bold; letter-spacing: 8px; color: #fff;
    line-height: 1.3;
  }
  .card .char-display .char-tap {
    display: inline-block; cursor: pointer; position: relative;
    padding: 0 2px; transition: transform 0.15s;
  }
  .card .char-display .char-tap:active { transform: scale(0.85); }
  .card .char-display .char-tap .char-pinyin {
    display: block; font-size: 14px; color: #e94560;
    font-weight: normal; letter-spacing: 0; margin-top: -4px;
    opacity: 0; transition: opacity 0.3s;
  }
  .card .char-display .char-tap .char-pinyin.show { opacity: 1; }

  .card .hint-row {
    margin-top: 10px; height: 22px;
    font-size: 14px; color: #e94560;
  }
  .card .speak-btn {
    position: absolute; top: 12px; right: 16px;
    background: none; border: none; color: #e94560;
    font-size: 22px; cursor: pointer; opacity: 0.7;
    transition: opacity 0.2s;
  }
  .card .speak-btn:hover { opacity: 1; }

  /* ── Input ── */
  .input-area { max-width: 480px; margin: 0 auto 16px; text-align: center; }
  #pinyin-input {
    width: 100%; padding: 14px 20px; font-size: 22px; text-align: center;
    border: 2px solid #333; border-radius: 12px;
    background: #16213e; color: #fff;
    outline: none; transition: border-color 0.3s, background 0.3s;
  }
  #pinyin-input:focus { border-color: #e94560; }
  #pinyin-input.correct { border-color: #4ade80; background: rgba(74,222,128,0.08); }
  #pinyin-input.wrong { border-color: #f87171; background: rgba(248,113,113,0.08); }

  .feedback {
    height: 28px; margin-top: 10px; font-size: 15px; text-align: center;
  }
  .feedback.ok { color: #4ade80; }
  .feedback.fail { color: #f87171; }
  .feedback.info { color: #fbbf24; }

  /* ── Controls ── */
  .controls {
    display: flex; gap: 10px; justify-content: center;
    flex-wrap: wrap; margin-bottom: 20px;
  }
  .controls button {
    padding: 8px 20px; border: none; border-radius: 8px;
    font-size: 13px; cursor: pointer; transition: opacity 0.2s;
  }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-secondary { background: #333; color: #aaa; }
  .controls button:active { opacity: 0.7; }

  /* ── Options (quiz mode) ── */
  .options {
    display: flex; flex-direction: column; gap: 8px;
    max-width: 480px; margin: 0 auto 16px;
  }
  .option-btn {
    padding: 12px 20px; background: #16213e; border: 2px solid #333;
    border-radius: 12px; color: #ddd; font-size: 16px;
    cursor: pointer; transition: all 0.2s;
  }
  .option-btn:active { transform: scale(0.97); }
  .option-btn.selected { border-color: #fbbf24; background: rgba(251,191,36,0.1); }
  .option-btn.correct { border-color: #4ade80; background: rgba(74,222,128,0.15); }
  .option-btn.wrong { border-color: #f87171; background: rgba(248,113,113,0.15); }

  /* ── Dictation ── */
  .dictation-hint {
    font-size: 20px; color: #fbbf24; margin-bottom: 8px;
    letter-spacing: 2px;
  }

  /* ── Finals Practice ── */
  .finals-tags {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center; margin-bottom: 12px;
  }
  .finals-tags span {
    padding: 3px 10px; border-radius: 12px;
    font-size: 13px; background: rgba(233,69,96,0.15); color: #e94560;
  }
  .finals-tags span.done { background: rgba(74,222,128,0.15); color: #4ade80; }

  /* ── Error Book ── */
  .err-book-toggle {
    text-align: center; margin-top: 8px;
  }
  .err-book-toggle button {
    background: none; border: none; color: #666; font-size: 12px;
    text-decoration: underline; cursor: pointer;
  }
  .err-book-panel {
    display: none; max-width: 480px; margin: 12px auto 0;
    background: #16213e; border-radius: 12px; padding: 16px;
  }
  .err-book-panel.open { display: block; }
  .err-book-panel h3 { font-size: 14px; color: #e94560; margin-bottom: 8px; }
  .err-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 1px solid #222; font-size: 14px;
  }
  .err-item .err-word { color: #fff; font-weight: bold; }
  .err-item .err-pinyin { color: #e94560; font-size: 12px; }
  .err-item button {
    background: none; border: 1px solid #444; color: #666;
    border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer;
  }

  /* ── Toast / animation ── */
  .toast {
    position: fixed; top: 30%; left: 50%; transform: translate(-50%,-50%) scale(0);
    font-size: 64px; pointer-events: none; transition: transform 0.3s;
    z-index: 999;
  }
  .toast.show { transform: translate(-50%,-50%) scale(1); }

  /* ── Responsive ── */
  @media (min-width: 600px) {
    body { padding: 40px 24px 80px; }
    .card { padding: 40px 36px; }
    .card .char-display { font-size: 64px; }
    #pinyin-input { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>拼音打字练习</h1>
  <p class="subtitle" id="mode-subtitle">看字打拼音，练出声调</p>
</div>

<div class="mode-bar" id="mode-bar">
  <button class="mode-btn active" data-mode="type">打字</button>
  <button class="mode-btn" data-mode="initial">声母韵母</button>
  <button class="mode-btn" data-mode="final">韵母专项</button>
  <button class="mode-btn" data-mode="dictation">听写</button>
  <button class="mode-btn" data-mode="quiz">选择题</button>
</div>

<div class="level-bar" id="level-bar">
  <button class="lvl-btn active" data-level="1">简单</button>
  <button class="lvl-btn" data-level="2">常用</button>
  <button class="lvl-btn" data-level="3">成语</button>
  <button class="lvl-btn" data-level="4">HSK1</button>
  <button class="lvl-btn" data-level="5">HSK2</button>
</div>

<div class="stats" id="stats">
  <div class="stat"><div class="stat-val" id="correct">0</div><div class="stat-lbl">正确</div></div>
  <div class="stat"><div class="stat-val" id="total">0</div><div class="stat-lbl">总数</div></div>
  <div class="stat"><div class="stat-val" id="rate">0%</div><div class="stat-lbl">正确率</div></div>
</div>

<div class="card" id="card">
  <button class="speak-btn" id="speak-btn" onclick="speakWord()">🔊</button>
  <div class="char-display" id="word-display"></div>
  <div class="hint-row" id="pinyin-hint"></div>
</div>

<!-- Typing / Initial-Final / Finals mode input -->
<div class="input-area" id="input-area">
  <input type="text" id="pinyin-input" placeholder="输入拼音" autocomplete="off" autofocus>
  <div class="feedback" id="feedback"></div>
</div>

<!-- Quiz options (hidden by default) -->
<div class="options" id="options-area" style="display:none"></div>

<!-- Controls -->
<div class="controls">
  <button class="btn-primary" onclick="nextWord()">下一题</button>
  <button class="btn-secondary" onclick="togglePinyin()">👁 看拼音</button>
  <button class="btn-secondary" onclick="resetStats()">↺ 重置</button>
</div>

<!-- Finals progress tags -->
<div class="finals-tags" id="finals-tags" style="display:none"></div>

<!-- Error Book -->
<div class="err-book-toggle">
  <button onclick="toggleErrorBook()">📖 错题本 (<span id="err-count">0</span>)</button>
</div>
<div class="err-book-panel" id="err-book-panel">
  <h3>错题本</h3>
  <div id="err-list"></div>
</div>

<!-- Toast animation -->
<div class="toast" id="toast"></div>

// ════════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════════
let mode = 'type';       // type | initial | final | dictation | quiz
let level = 1;
let currentWord = null;
let correct = 0;
let total = 0;
let used = [];
let showPinyin = false;
let quizAnswered = false;
let sessionStats = loadSessionStats();

// ════════════════════════════════════════════════════════════════
//  DOM REFS
// ════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const wordDisplay = $('word-display');
const pinyinHint = $('pinyin-hint');
const input = $('pinyin-input');
const feedback = $('feedback');
const correctEl = $('correct');
const totalEl = $('total');
const rateEl = $('rate');
const inputArea = $('input-area');
const optionsArea = $('options-area');
const finalsTags = $('finals-tags');
const errCount = $('err-count');
const errList = $('err-list');
const toast = $('toast');
const modeSubtitle = $('mode-subtitle');

// ════════════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════════════
function shuffle(arr) { for (let i = arr.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

function splitPinyin(p) {
  // Split pinyin by spaces, handling multi-char words
  return p.trim().split(/\s+/);
}

const INITIALS = ['b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w'];
function getInitial(py) { for (const i of INITIALS) { if (py.startsWith(i)) return i; } return ''; }
function getFinal(py) { const i = getInitial(py); return py.slice(i.length); }

function extractFinals(pinyin) {
  return splitPinyin(pinyin).map(p => getFinal(p));
}

// ════════════════════════════════════════════════════════════════
//  SPEECH (Web Speech API - works on iOS Safari)
// ════════════════════════════════════════════════════════════════
function speakWord() {
  if (!currentWord) return;
  const u = new SpeechSynthesisUtterance(currentWord.w);
  u.lang = 'zh-CN';
  u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function speakText(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = 0.8;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ════════════════════════════════════════════════════════════════
//  WORD PICKING
// ════════════════════════════════════════════════════════════════
function pickWord() {
  const pool = WORDS[level].filter(w => !used.includes(w.w));
  if (pool.length === 0) used = [];
  const source = pool.length ? pool : WORDS[level];
  return source[Math.floor(Math.random() * source.length)];
}

// ════════════════════════════════════════════════════════════════
//  DISPLAY
// ════════════════════════════════════════════════════════════════
function showCharDisplay(word) {
  wordDisplay.innerHTML = '';
  [...word.w].forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'char-tap';
    span.textContent = ch;
    span.onclick = () => speakText(ch);
    const pySpan = document.createElement('span');
    pySpan.className = 'char-pinyin';
    const pys = splitPinyin(word.p);
    pySpan.textContent = pys[i] || '';
    if (showPinyin) pySpan.classList.add('show');
    span.appendChild(pySpan);
    wordDisplay.appendChild(span);
  });
}

function updatePinyinHint(word) {
  if (mode === 'type' || mode === 'quiz') {
    pinyinHint.textContent = showPinyin ? `🔊 ${word.p}` : '';
  } else if (mode === 'initial') {
    const pys = splitPinyin(word.p);
    pinyinHint.textContent = showPinyin ? `🔊 ${word.p}` : '';
  } else if (mode === 'final') {
    pinyinHint.textContent = showPinyin ? `🔊 ${word.p}` : '';
  } else if (mode === 'dictation') {
    pinyinHint.textContent = '输入对应的汉字';
  }
}

// ════════════════════════════════════════════════════════════════
//  TOGGLE PINYIN
// ════════════════════════════════════════════════════════════════
function togglePinyin() {
  showPinyin = !showPinyin;
  if (currentWord) {
    updateCharPinyin(currentWord);
    updatePinyinHint(currentWord);
  }
}

function updateCharPinyin(word) {
  const charSpans = wordDisplay.querySelectorAll('.char-tap .char-pinyin');
  const pys = splitPinyin(word.p);
  charSpans.forEach((el, i) => {
    el.textContent = pys[i] || '';
    if (showPinyin) el.classList.add('show');
    else el.classList.remove('show');
  });
}

// ════════════════════════════════════════════════════════════════
//  MODE-SPECIFIC SHOW
// ════════════════════════════════════════════════════════════════
function showWord() {
  currentWord = pickWord();
  showCharDisplay(currentWord);
  updatePinyinHint(currentWord);
  input.value = '';
  input.className = '';
  feedback.textContent = '';
  quizAnswered = false;
  input.focus();

  if (mode === 'quiz') {
    showQuizOptions(currentWord);
  } else if (mode === 'final') {
    showFinalsTags(currentWord);
  }

  // Auto-speak on new word
  setTimeout(() => speakWord(), 300);
}

function showFinalsTags(word) {
  finalsTags.style.display = 'flex';
  finalsTags.innerHTML = '';
  const finals = extractFinals(word.p);
  finals.forEach((f, i) => {
    const tag = document.createElement('span');
    tag.textContent = `韵母${i+1}: ${f}`;
    tag.id = `final-${i}`;
    finalsTags.appendChild(tag);
  });
}

function markFinalDone(idx) {
  const tag = $(`final-${idx}`);
  if (tag) tag.classList.add('done');
}

// ════════════════════════════════════════════════════════════════
//  QUIZ MODE
// ════════════════════════════════════════════════════════════════
function showQuizOptions(word) {
  optionsArea.style.display = 'flex';
  inputArea.style.display = 'none';

  // Generate 3 wrong options from same level
  const pool = WORDS[level].filter(w => w.w !== word.w);
  const wrongs = shuffle([...pool]).slice(0, 3).map(w => w.p);
  const options = shuffle([word.p, ...wrongs]);

  optionsArea.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.dataset.value = opt;
    btn.onclick = () => {
      if (quizAnswered) return;
      document.querySelectorAll('.option-btn').forEach(b => b.classList.add('selected'));
      quizAnswered = true;
      if (opt === word.p) {
        btn.classList.add('correct');
        feedback.textContent = '✓ 正确！';
        feedback.className = 'feedback ok';
        correct++;
        showToast('👍');
      } else {
        btn.classList.add('wrong');
        // Highlight correct answer
        document.querySelectorAll('.option-btn').forEach(b => {
          if (b.dataset.value === word.p) b.classList.add('correct');
        });
        feedback.innerHTML = `✗ 正确答案: ${word.p}`;
        feedback.className = 'feedback fail';
        addError(currentWord);
        showToast('😅');
      }
      total++;
      updateStats();
      setTimeout(nextWord, 1200);
    };
    optionsArea.appendChild(btn);
  });
}

// ════════════════════════════════════════════════════════════════
//  CHECK ANSWER (type / initial / final / dictation)
// ════════════════════════════════════════════════════════════════
function checkAnswer() {
  if (!currentWord) { nextWord(); return; }

  const inputVal = input.value.trim().toLowerCase();
  if (!inputVal) { input.focus(); return; }

  let isCorrect = false;
  let target = '';

  if (mode === 'type') {
    target = currentWord.p.toLowerCase();
    isCorrect = inputVal === target;
  } else if (mode === 'dictation') {
    // User types Chinese characters, check against word
    target = currentWord.w;
    isCorrect = inputVal === target.toLowerCase(); // allow case mismatch but exact char match
    // Actually for dictation, they type Chinese chars
    isCorrect = inputVal === currentWord.w;
  } else if (mode === 'initial') {
    const pys = splitPinyin(currentWord.p);
    const expected = pys.map(p => getInitial(p)).filter(i => i).join(' ');
    target = expected;
    isCorrect = inputVal === target;
  } else if (mode === 'final') {
    const pys = splitPinyin(currentWord.p);
    const expectedFinals = pys.map(p => getFinal(p));
    const inputParts = inputVal.split(/\s+/);
    if (inputParts.length === expectedFinals.length) {
      isCorrect = inputParts.every((part, i) => part === expectedFinals[i]);
      target = expectedFinals.join(' ');
    } else {
      isCorrect = false;
      target = expectedFinals.join(' ');
    }
  }

  total++;

  if (isCorrect) {
    correct++;
    input.className = 'correct';
    feedback.textContent = '✓ 正确！';
    feedback.className = 'feedback ok';
    showToast('👍');
    if (mode === 'final') {
      const finals = extractFinals(currentWord.p);
      finals.forEach((_, i) => markFinalDone(i));
    }
    setTimeout(nextWord, 700);
  } else {
    input.className = 'wrong';
    feedback.innerHTML = `✗ 正确答案: ${target} &nbsp; <small>你输入: ${inputVal}</small>`;
    feedback.className = 'feedback fail';
    addError(currentWord);
    showToast('😅');
  }

  updateStats();
}

// ════════════════════════════════════════════════════════════════
//  ERROR BOOK (localStorage)
// ════════════════════════════════════════════════════════════════
function loadErrors() {
  try { return JSON.parse(localStorage.getItem('py_errors') || '[]'); } catch { return []; }
}
function saveErrors(errs) {
  localStorage.setItem('py_errors', JSON.stringify(errs));
}

function addError(word) {
  const errs = loadErrors();
  if (!errs.find(e => e.w === word.w)) {
    errs.push({ w: word.w, p: word.p, count: 1, added: Date.now() });
  } else {
    const e = errs.find(e => e.w === word.w);
    e.count = (e.count || 0) + 1;
  }
  saveErrors(errs);
  updateErrorBook();
}

function removeError(word) {
  let errs = loadErrors().filter(e => e.w !== word);
  saveErrors(errs);
  updateErrorBook();
}

function updateErrorBook() {
  const errs = loadErrors();
  errCount.textContent = errs.length;
  errList.innerHTML = '';
  errs.forEach(e => {
    const div = document.createElement('div');
    div.className = 'err-item';
    div.innerHTML = `
      <span><span class="err-word">${e.w}</span> <span class="err-pinyin">${e.p}</span> <span style="color:#666;font-size:11px">×${e.count||1}</span></span>
      <button onclick="removeError('${e.w}')">删除</button>
    `;
    errList.appendChild(div);
  });
}

function toggleErrorBook() {
  const panel = $('err-book-panel');
  panel.classList.toggle('open');
  updateErrorBook();
}

// ════════════════════════════════════════════════════════════════
//  SESSION STATS
// ════════════════════════════════════════════════════════════════
function loadSessionStats() {
  try { return JSON.parse(localStorage.getItem('py_stats') || '{"correct":0,"total":0}'); } catch { return { correct:0, total:0 }; }
}
function saveSessionStats() {
  localStorage.setItem('py_stats', JSON.stringify(sessionStats));
}

// ════════════════════════════════════════════════════════════════
//  STATS DISPLAY
// ════════════════════════════════════════════════════════════════
function updateStats() {
  correctEl.textContent = correct;
  totalEl.textContent = total;
  rateEl.textContent = total > 0 ? Math.round(correct / total * 100) + '%' : '0%';
}

// ════════════════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════════════════
function showToast(emoji) {
  toast.textContent = emoji;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 500);
}

// ════════════════════════════════════════════════════════════════
//  NAVIGATE
// ════════════════════════════════════════════════════════════════
function nextWord() {
  showWord();
}

function resetStats() {
  correct = 0;
  total = 0;
  used = [];
  updateStats();
  showWord();
}

// ════════════════════════════════════════════════════════════════
//  MODE SWITCHING
// ════════════════════════════════════════════════════════════════
function setMode(newMode) {
  mode = newMode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  used = [];

  // Show/hide controls based on mode
  inputArea.style.display = (mode === 'quiz') ? 'none' : 'block';
  optionsArea.style.display = (mode === 'quiz') ? 'flex' : 'none';
  finalsTags.style.display = (mode === 'final') ? 'flex' : 'none';

  const subtitles = {
    type: '看字打拼音，练出声调',
    initial: '先打声母，再打韵母',
    final: '专项练习韵母',
    dictation: '看拼音，输入汉字',
    quiz: '四选一，选对拼音',
  };
  modeSubtitle.textContent = subtitles[mode] || '';

  const placeholders = {
    type: '输入拼音（不用声调）',
    initial: '输入声母（如: zh g）',
    final: '输入韵母（如: ong iao）',
    dictation: '输入汉字',
    quiz: '',
  };
  input.placeholder = placeholders[mode] || '';

  showWord();
}

// ════════════════════════════════════════════════════════════════
//  EVENT LISTENERS
// ════════════════════════════════════════════════════════════════
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});

document.querySelectorAll('.lvl-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    level = parseInt(btn.dataset.level);
    used = [];
    showWord();
  });
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (input.className === 'wrong' || input.className === 'correct') {
      nextWord();
    } else {
      checkAnswer();
    }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' && document.activeElement !== input) {
    e.preventDefault();
    if (mode !== 'quiz') nextWord();
  }
});

// ════════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════════
updateErrorBook();
showWord();
</script>
