<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拼音发音点读</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #FF6B6B;
    --primary-dark: #E85050;
    --bg: #FFF5F5;
    --card: #FFFFFF;
    --text: #2D3436;
    --text-light: #636E72;
    --accent: #FFD93D;
    --green: #6BCB77;
    --blue: #4D96FF;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 80px;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Top Bar ── */
  .top-bar {
    background: linear-gradient(135deg, #FF6B6B, #EE5A24);
    padding: 40px 20px 24px;
    text-align: center;
    color: #fff;
    border-radius: 0 0 24px 24px;
    position: relative;
  }
  .top-bar h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
  .top-bar .sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  /* ── Unit Selector ── */
  .unit-bar {
    display: flex; gap: 6px; padding: 14px 16px 8px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .unit-bar::-webkit-scrollbar { display: none; }
  .unit-btn {
    flex-shrink: 0; padding: 6px 16px;
    border-radius: 20px; border: none;
    font-size: 13px; font-weight: 500;
    background: #fff; color: var(--text-light);
    box-shadow: var(--shadow); cursor: pointer;
    transition: all 0.2s;
  }
  .unit-btn.active { background: var(--primary); color: #fff; }

  /* ── Stats Mini ── */
  .stats-row {
    display: flex; justify-content: space-between;
    padding: 8px 20px 6px;
    font-size: 12px; color: var(--text-light);
  }
  .stats-row span { display: flex; align-items: center; gap: 4px; }

  /* ── Word Card ── */
  .card-wrap {
    padding: 12px 16px;
  }
  .word-card {
    background: var(--card);
    border-radius: 20px;
    padding: 36px 24px 28px;
    text-align: center;
    box-shadow: var(--shadow);
    max-width: 400px; margin: 0 auto;
    position: relative;
  }
  .word-card .main-word {
    font-size: 56px; font-weight: 700;
    letter-spacing: 12px;
    color: var(--text);
    line-height: 1.3;
    user-select: none;
  }
  .word-card .main-word .char {
    display: inline-block;
    cursor: pointer;
    transition: transform 0.15s;
    position: relative;
  }
  .word-card .main-word .char:active {
    transform: scale(0.85);
  }
  .word-card .main-word .char .py-above {
    display: block;
    font-size: 18px;
    font-weight: 500;
    color: var(--primary);
    letter-spacing: 0;
    margin-bottom: -2px;
    opacity: 0;
    transition: opacity 0.3s;
    height: 24px;
    line-height: 24px;
  }
  .word-card .main-word .char .py-above.show {
    opacity: 1;
  }

  .word-card .play-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    margin: 16px auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(255,107,107,0.4);
    transition: transform 0.2s;
  }
  .word-card .play-btn:active { transform: scale(0.9); }

  .word-card .pinyin-row {
    font-size: 20px;
    color: var(--primary);
    font-weight: 500;
    height: 28px;
    line-height: 28px;
    margin-top: 4px;
    letter-spacing: 2px;
  }

  /* ── Action Buttons ── */
  .action-row {
    display: flex; gap: 12px;
    justify-content: center;
    padding: 0 16px 16px;
  }
  .action-btn {
    flex: 1; max-width: 160px;
    padding: 12px 0;
    border: none; border-radius: 14px;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .action-btn:active { transform: scale(0.95); }
  .action-btn.primary { background: var(--primary); color: #fff; box-shadow: 0 3px 12px rgba(255,107,107,0.3); }
  .action-btn.secondary { background: #fff; color: var(--text-light); box-shadow: var(--shadow); }
  .action-btn.green { background: var(--green); color: #fff; box-shadow: 0 3px 12px rgba(107,203,119,0.3); }
  .action-btn.blue { background: var(--blue); color: #fff; box-shadow: 0 3px 12px rgba(77,150,255,0.3); }

  /* ── Bottom Tab Bar ── */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff;
    display: flex;
    border-top: 1px solid #eee;
    padding: 6px 0 env(safe-area-inset-bottom);
    z-index: 100;
  }
  .tab-btn {
    flex: 1;
    border: none; background: none;
    padding: 6px 0;
    font-size: 11px;
    color: var(--text-light);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: color 0.2s;
  }
  .tab-btn .tab-icon { font-size: 20px; }
  .tab-btn.active { color: var(--primary); }
  .tab-btn .badge {
    background: var(--primary); color: #fff;
    font-size: 10px; font-weight: 700;
    border-radius: 10px; padding: 1px 6px;
    position: absolute; margin-top: -4px; margin-left: 12px;
  }

  /* ── Section: point-read ── */
  .section { display: none; }
  .section.active { display: block; }

  /* ── List Mode ── */
  .word-list {
    padding: 8px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .word-list a {
    display: inline-block;
    padding: 8px 16px;
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    font-size: 16px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s;
  }
  .word-list a:active { transform: scale(0.95); }
  .word-list a .word-list-py {
    display: block;
    font-size: 11px;
    color: var(--primary);
    margin-top: 2px;
  }

  /* ── Quiz Section ── */
  .quiz-options {
    display: flex; flex-direction: column; gap: 10px;
    padding: 0 16px; max-width: 400px; margin: 0 auto;
  }
  .quiz-option {
    padding: 14px 20px;
    background: var(--card);
    border: 2px solid #eee;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .quiz-option:active { transform: scale(0.97); }
  .quiz-option.correct { border-color: var(--green); background: #F0FFF4; }
  .quiz-option.wrong { border-color: var(--primary); background: #FFF5F5; }

  /* ── Error Book ── */
  .err-book {
    padding: 12px 16px;
  }
  .err-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .err-item .err-word { font-size: 18px; font-weight: 600; }
  .err-item .err-py { font-size: 13px; color: var(--primary); margin-top: 2px; }
  .err-item .err-del {
    background: none; border: 1px solid #eee;
    border-radius: 8px; padding: 4px 10px;
    font-size: 12px; color: var(--text-light); cursor: pointer;
  }

  /* ── Empty state ── */
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-light);
  }
  .empty-state .big { font-size: 48px; margin-bottom: 12px; }

  /* ── Toast ── */
  .toast {
    position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%) scale(0);
    font-size: 72px; pointer-events: none;
    transition: transform 0.3s; z-index: 999;
  }
  .toast.show { transform: translate(-50%,-50%) scale(1); }

  /* ── Animation ── */
  @keyframes bounceIn {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  .bounce-in { animation: bounceIn 0.4s ease; }

  @media (min-width: 500px) {
    .word-card .main-word { font-size: 68px; }
    .top-bar { padding: 50px 20px 30px; }
  }
</style>
</head>
<body>

<!-- ═══ Toast ═══ -->
<div class="toast" id="toast"></div>

<!-- ═══ Top Bar ═══ -->
<div class="top-bar">
  <h1>🦊 拼音点读</h1>
  <div class="sub">点一下字就会读哦</div>
</div>

<!-- ═══ Unit Selector ═══ -->
<div class="unit-bar" id="unit-bar"></div>

<!-- ═══ Stats ═══ -->
<div class="stats-row">
  <span>📖 已学 <strong id="learned-count">0</strong></span>
  <span>✅ 正确 <strong id="correct-count">0</strong></span>
  <span>📊 正确率 <strong id="rate-display">0%</strong></span>
</div>

<!-- ═══ Section: 点读 ═══ -->
<div class="section active" id="sec-pointread">
  <div class="card-wrap">
    <div class="word-card bounce-in" id="word-card">
      <div class="main-word" id="main-word"></div>
      <button class="play-btn" id="play-btn">🔊</button>
      <div class="pinyin-row" id="pinyin-row"></div>
    </div>
  </div>
  <div class="action-row">
    <button class="action-btn primary" id="prev-btn">◀ 上一个</button>
    <button class="action-btn green" id="next-btn">下一个 ▶</button>
  </div>
  <div class="action-row">
    <button class="action-btn secondary" id="toggle-py-btn">👁 显示拼音</button>
    <button class="action-btn secondary" id="shuffle-btn">🔀 随机</button>
  </div>
</div>

<!-- ═══ Section: 列表 ═══ -->
<div class="section" id="sec-list">
  <div class="word-list" id="word-list"></div>
</div>

<!-- ═══ Section: 测验 ═══ -->
<div class="section" id="sec-quiz">
  <div class="card-wrap">
    <div class="word-card">
      <div class="main-word" style="font-size:48px;letter-spacing:4px" id="quiz-word"></div>
      <div class="pinyin-row" style="color:var(--text-light);font-size:14px" id="quiz-desc">选择正确的拼音</div>
    </div>
  </div>
  <div class="quiz-options" id="quiz-options"></div>
  <div class="action-row">
    <button class="action-btn primary" id="quiz-next">下一题 ▶</button>
  </div>
</div>

<!-- ═══ Section: 错题本 ═══ -->
<div class="section" id="sec-errors">
  <div class="err-book" id="err-book"></div>
</div>

<!-- ═══ Bottom Tab Bar ═══ -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="sec-pointread">
    <span class="tab-icon">📖</span>
    <span>点读</span>
  </button>
  <button class="tab-btn" data-tab="sec-list">
    <span class="tab-icon">📋</span>
    <span>词库</span>
  </button>
  <button class="tab-btn" data-tab="sec-quiz">
    <span class="tab-icon">✍️</span>
    <span>测验</span>
  </button>
  <button class="tab-btn" data-tab="sec-errors">
    <span class="tab-icon">📕</span>
    <span>错题</span>
    <span class="badge" id="tab-err-badge" style="display:none">0</span>
  </button>
</div>

// ════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════
let currentUnit = 0;
let currentIndex = 0;
let showPinyin = true;
let learned = loadLearned();
let errors = loadErrors();
let quizAnswered = false;

// ════════════════════════════════════════════════════════════
//  DOM
// ════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const mainWord = $('main-word');
const pinyinRow = $('pinyin-row');
const playBtn = $('play-btn');
const prevBtn = $('prev-btn');
const nextBtn = $('next-btn');
const togglePyBtn = $('toggle-py-btn');
const shuffleBtn = $('shuffle-btn');
const unitBar = $('unit-bar');
const wordList = $('word-list');
const toast = $('toast');
const quizWord = $('quiz-word');
const quizOptions = $('quiz-options');
const quizNext = $('quiz-next');
const errBook = $('err-book');
const tabErrBadge = $('tab-err-badge');
const learnedCount = $('learned-count');
const correctCount = $('correct-count');
const rateDisplay = $('rate-display');

// ════════════════════════════════════════════════════════════
//  LOCAL STORAGE
// ════════════════════════════════════════════════════════════
function loadLearned() {
  try { return JSON.parse(localStorage.getItem('pd_learned') || '{}'); } catch { return {}; }
}
function saveLearned() { localStorage.setItem('pd_learned', JSON.stringify(learned)); }

function loadErrors() {
  try { return JSON.parse(localStorage.getItem('pd_errors') || '[]'); } catch { return []; }
}
function saveErrors() { localStorage.setItem('pd_errors', JSON.stringify(errors)); updateErrorTab(); }

// ════════════════════════════════════════════════════════════
//  SPEECH
// ════════════════════════════════════════════════════════════
function speakWord(word) {
  if (!word) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'zh-CN'; u.rate = 0.85;
  speechSynthesis.speak(u);
}

function speakChar(ch) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(ch);
  u.lang = 'zh-CN'; u.rate = 0.8;
  speechSynthesis.speak(u);
}

// ════════════════════════════════════════════════════════════
//  DISPLAY WORD
// ════════════════════════════════════════════════════════════
function markLearned(word) {
  learned[word.w] = (learned[word.w] || 0) + 1;
  saveLearned();
  updateStats();
}

function getCurrentWords() { return UNITS[currentUnit].words; }

function showWord(index) {
  const words = getCurrentWords();
  if (index < 0) index = words.length - 1;
  if (index >= words.length) index = 0;
  currentIndex = index;
  const item = words[currentIndex];
  if (!item) return;

  // Build char display with clickable characters
  mainWord.innerHTML = '';
  [...item.w].forEach(ch => {
    const span = document.createElement('span');
    span.className = 'char';
    const pySpan = document.createElement('span');
    pySpan.className = 'py-above' + (showPinyin ? ' show' : '');
    const pys = item.p.split(/\s+/);
    const idx = [...item.w].indexOf(ch);
    pySpan.textContent = pys[idx] || '';
    span.appendChild(pySpan);
    const chSpan = document.createElement('span');
    chSpan.textContent = ch;
    chSpan.style.cssText = 'cursor:pointer';
    chSpan.onclick = (e) => { e.stopPropagation(); speakChar(ch); };
    span.appendChild(chSpan);
    mainWord.appendChild(span);
  });

  // Pinyin row below
  pinyinRow.textContent = showPinyin ? item.p : '';

  // Mark as learned
  markLearned(item);

  // Re-bounce animation
  const card = $('word-card');
  card.classList.remove('bounce-in');
  void card.offsetWidth;
  card.classList.add('bounce-in');
}

function refreshCurrentWord() {
  showWord(currentIndex);
}

// ════════════════════════════════════════════════════════════
//  TOGGLE PINYIN
// ════════════════════════════════════════════════════════════
togglePyBtn.onclick = () => {
  showPinyin = !showPinyin;
  togglePyBtn.textContent = showPinyin ? '🙈 隐藏拼音' : '👁 显示拼音';
  refreshCurrentWord();
};

// ════════════════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════════════════
prevBtn.onclick = () => showWord(currentIndex - 1);
nextBtn.onclick = () => showWord(currentIndex + 1);
shuffleBtn.onclick = () => {
  showWord(Math.floor(Math.random() * getCurrentWords().length));
};

// Keyboard left/right navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') showWord(currentIndex - 1);
  if (e.key === 'ArrowRight') showWord(currentIndex + 1);
  if (e.key === ' ') { e.preventDefault(); speakWord(getCurrentWords()[currentIndex]?.w); }
});

// ════════════════════════════════════════════════════════════
//  PLAY BUTTON
// ════════════════════════════════════════════════════════════
playBtn.onclick = () => {
  const item = getCurrentWords()[currentIndex];
  if (item) speakWord(item.w);
};

// Click any char
mainWord.addEventListener('click', (e) => {
  // handled by individual spans
});

// ════════════════════════════════════════════════════════════
//  UNIT SELECTOR
// ════════════════════════════════════════════════════════════
function buildUnits() {
  unitBar.innerHTML = '';
  UNITS.forEach((u, i) => {
    const btn = document.createElement('button');
    btn.className = 'unit-btn' + (i === currentUnit ? ' active' : '');
    btn.textContent = u.name;
    btn.onclick = () => {
      currentUnit = i;
      document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentIndex = 0;
      showWord(0);
      buildWordList();
    };
    unitBar.appendChild(btn);
  });
}

// ════════════════════════════════════════════════════════════
//  WORD LIST
// ════════════════════════════════════════════════════════════
function buildWordList() {
  wordList.innerHTML = '';
  getCurrentWords().forEach((item, i) => {
    const a = document.createElement('a');
    a.innerHTML = `${item.w} <span class="word-list-py">${item.p}</span>`;
    a.href = '#';
    a.onclick = (e) => {
      e.preventDefault();
      switchTab('sec-pointread');
      currentIndex = i;
      showWord(i);
    };
    wordList.appendChild(a);
  });
}

// ════════════════════════════════════════════════════════════
//  TAB SWITCHING
// ════════════════════════════════════════════════════════════
function switchTab(tabId) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));

  if (tabId === 'sec-list') buildWordList();
  if (tabId === 'sec-quiz') showQuiz();
  if (tabId === 'sec-errors') buildErrorBook();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// ════════════════════════════════════════════════════════════
//  QUIZ
// ════════════════════════════════════════════════════════════
let quizCorrect = 0;
let quizTotal = 0;

function showQuiz() {
  const words = getCurrentWords();
  if (words.length < 4) {
    quizWord.textContent = '词太少啦';
    quizOptions.innerHTML = '';
    return;
  }

  quizAnswered = false;

  // Pick a random word for the question
  const qIdx = Math.floor(Math.random() * words.length);
  const qWord = words[qIdx];
  quizWord.textContent = qWord.w;

  // Pick 3 other random pinyin as wrong options
  const others = words.filter(w => w.w !== qWord.w);
  shuffle(others);
  const wrongs = others.slice(0, 3).map(w => w.p);
  const options = shuffle([qWord.p, ...wrongs]);

  quizOptions.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('div');
    btn.className = 'quiz-option';
    btn.textContent = opt;
    btn.onclick = () => {
      if (quizAnswered) return;
      quizAnswered = true;
      quizTotal++;
      document.querySelectorAll('.quiz-option').forEach(b => {
        if (b.textContent === qWord.p) b.classList.add('correct');
      });
      if (opt === qWord.p) {
        btn.classList.add('correct');
        quizCorrect++;
        showToast('👍');
      } else {
        btn.classList.add('wrong');
        addErrorItem(qWord);
        showToast('😅');
      }
      updateStats();
    };
    quizOptions.appendChild(btn);
  });
}

quizNext.onclick = showQuiz;

// ════════════════════════════════════════════════════════════
//  ERROR BOOK
// ════════════════════════════════════════════════════════════
function addErrorItem(word) {
  if (!errors.find(e => e.w === word.w)) {
    errors.push({ w: word.w, p: word.p });
  }
  saveErrors();
}

function buildErrorBook() {
  errBook.innerHTML = '';
  if (errors.length === 0) {
    errBook.innerHTML = '<div class="empty-state"><div class="big">🎉</div><p>没有错题，太棒了！</p></div>';
    return;
  }
  errors.forEach((e, i) => {
    const div = document.createElement('div');
    div.className = 'err-item bounce-in';
    div.innerHTML = `
      <div>
        <div class="err-word">${e.w}</div>
        <div class="err-py">${e.p}</div>
      </div>
      <button class="err-del" data-idx="${i}">删除</button>
    `;
    div.querySelector('.err-del').onclick = () => {
      errors.splice(i, 1);
      saveErrors();
      buildErrorBook();
    };
    // Click word to jump to point-read
    div.querySelector('.err-word').style.cursor = 'pointer';
    div.querySelector('.err-word').onclick = () => {
      const words = getCurrentWords();
      const idx = words.findIndex(w => w.w === e.w);
      if (idx >= 0) {
        currentIndex = idx;
        switchTab('sec-pointread');
        showWord(idx);
      }
    };
    errBook.appendChild(div);
  });
}

function updateErrorTab() {
  tabErrBadge.textContent = errors.length;
  tabErrBadge.style.display = errors.length > 0 ? 'inline' : 'none';
}

// ════════════════════════════════════════════════════════════
//  STATS
// ════════════════════════════════════════════════════════════
function updateStats() {
  const total = errors.length + quizTotal;
  const correct = quizCorrect;
  learnedCount.textContent = Object.keys(learned).length;
  correctCount.textContent = quizCorrect;
  rateDisplay.textContent = quizTotal > 0 ? Math.round(quizCorrect / quizTotal * 100) + '%' : '0%';
}

// ════════════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════════════
function showToast(emoji) {
  toast.textContent = emoji;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 500);
}

// ════════════════════════════════════════════════════════════
//  UTILITY
// ════════════════════════════════════════════════════════════
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════
buildUnits();
showWord(0);
updateStats();
updateErrorTab();
buildWordList();
</script>
